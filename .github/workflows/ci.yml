name: CI

# Blocking gates: install, check-types (server/ui/payroll-engine), build, audit:permissions.
# Informational (non-blocking) gates: ultracite lint and web type-check, which carry a
# documented pre-existing baseline (212 lint findings; 7 web tsc errors in legacy
# docs/settings/employees/login files). These run with continue-on-error so they surface
# regressions in PR logs without blocking merges until the baseline is burned down.
# See docs/architecture/modules/implementation-sequence.md (QA hardening pass) for the baseline.

on:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (types · build · permissions)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.12"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # --- Blocking gates ---
      - name: Type-check (turbo)
        run: bun run check-types

      - name: Build
        run: bun run build

      - name: Audit permissions (access-control statement)
        run: bun run audit:permissions

      # --- Informational gates (non-blocking baseline) ---
      - name: Lint (ultracite — informational)
        continue-on-error: true
        run: bun run check

      - name: Web type-check (informational baseline)
        continue-on-error: true
        run: bun run --cwd apps/web typecheck
